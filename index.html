<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Motion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <strong>Claude Motion</strong>
    <span id="host" class="pill">…</span>
    <span id="bridge" class="pill" title="Claude Desktop connector">● Desktop: off</span>
    <button id="settingsBtn" class="ghost" title="Settings">⚙</button>
  </header>

  <section id="settings" hidden>
    <label>Connection
      <select id="mode">
        <option value="free">Free — copy/paste with claude.ai (no API key)</option>
        <option value="gemini">Google Gemini — free API key (automatic)</option>
        <option value="api">Claude API key (automatic, needs credits)</option>
      </select>
    </label>
    <label id="keyRow">Anthropic API key
      <input id="apiKey" type="password" placeholder="sk-ant-...">
    </label>
    <label id="gemRow">Google Gemini API key (free from aistudio.google.com/apikey)
      <input id="gemKey" type="password" placeholder="AIza...">
      <select id="gemModel">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (free, fast)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (free, smarter, lower limits)</option>
      </select>
    </label>
    <label id="modelRow">Model
      <select id="model">
        <option value="claude-opus-5-5">Claude Opus 5.5 (best)</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (fast)</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 (fastest)</option>
      </select>
    </label>
    <label class="row"><input id="autoRun" type="checkbox"> Run generated scripts automatically</label>
    <label class="row"><input id="bridgeOn" type="checkbox" checked> Allow Claude Desktop (MCP connector) to control this app</label>
    <button id="saveSettings">Save</button>
  </section>

  <section id="presets"></section>

  <div id="log"></div>

  <footer>
    <textarea id="prompt" rows="3" placeholder="e.g. Add a lower third saying 'Himan — Editor' with a slide-in animation"></textarea>
    <div class="row">
      <button id="send">Send to Claude</button>
      <button id="clear" class="ghost">Clear</button>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/updater.js"></script>
</body>
</html>
